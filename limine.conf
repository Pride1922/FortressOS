# Limine Bootloader Configuration for FortressOS
timeout: 3
wallpaper: boot():/boot/splash.png
wallpaper_style: centered
backdrop: 1A1B26

/FortressOS
    protocol: limine
    kernel_path: boot():/boot/fortress.elf
    module_path: boot():/boot/initramfs.tar

/FortressOS (Verbose Debug)
    protocol: limine
    kernel_path: boot():/boot/fortress.elf
    module_path: boot():/boot/initramfs.tar
    kernel_cmdline: verbose

